<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLE — Niveau A1 — Dossier 0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#182a6b;
  --navy-deep:#0f1c4d;
  --brand-blue:#3a6df0;
  --gold:#ffb703;
  --gold-dark:#b8790a;
  --gold-light:#ffe08a;
  --cream:#fff8ef;
  --paper:#ffffff;
  --ink:#20232b;
  --grey:#6b7280;
  --line:#ece1cf;
  --ok:#06a77d;
  --ok-bg:#e2f8f0;
  --bad:#ef476f;
  --bad-bg:#fde5eb;
  --pt:#b8791b;
  --accent:#3a6df0;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',sans-serif;
  background:var(--cream);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
.app{display:flex; min-height:100vh;}

/* ---- Sidebar ---- */
.sidebar{
  width:230px; flex:none;
  background:var(--navy);
  color:#fff;
  padding:28px 18px 18px;
  position:relative;
  background-image:
    radial-gradient(circle at 14px 0, transparent 6px, var(--navy) 7px);
  background-size:28px 34px;
  background-repeat:repeat-y;
  background-position: -8px 10px;
}
.cover-label{
  font-family:'Fraunces',serif;
  font-size:13px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--gold-light); margin:0 0 2px 10px;
}
.cover-title{
  font-family:'Fraunces',serif; font-weight:700;
  font-size:30px; line-height:1.05; margin:0 0 4px 10px; color:#fff;
}
.cover-sub{
  margin:0 0 20px 10px; font-size:12.5px; color:#c9d3e6; line-height:1.5;
}
.student-badge{
  margin:0 10px 20px; padding:10px 12px; background:rgba(255,255,255,.08);
  border-radius:9px; font-size:12.5px; line-height:1.5;
}
.student-badge b{color:#fff; display:block; font-size:14px; margin-bottom:2px;}
nav.weeks{display:flex; flex-direction:column; gap:6px;}
.nav-btn{
  display:flex; align-items:center; gap:10px;
  text-align:left; background:transparent; border:none; color:#dbe3f2;
  font-family:'Inter',sans-serif; font-size:14px; font-weight:500;
  padding:11px 12px 11px 14px; border-radius:8px; cursor:pointer; width:100%;
  transition:background .15s ease, color .15s ease;
}
.nav-btn .tag{
  font-family:'Fraunces',serif; font-weight:700; font-size:13px;
  color:var(--tag-color, var(--gold-light)); min-width:20px;
}
.nav-btn:hover{background:rgba(255,255,255,.1);}
.nav-btn.active{background:var(--tag-color, var(--gold)); color:#fff; font-weight:700;}
.nav-btn.active .tag{color:#fff;}
.nav-sep{border-top:1px solid rgba(255,255,255,.15); margin:14px 0;}
.sidebar-foot{
  margin-top:20px; padding:14px 12px; border-top:1px solid rgba(255,255,255,.15);
  font-size:11.5px; color:#a9b6d2; line-height:1.5;
}
.teacher-link{
  display:block; margin-top:10px; font-size:12px; color:var(--gold-light);
  text-decoration:none; font-weight:600; cursor:pointer;
}
.teacher-link:hover{text-decoration:underline;}

/* ---- Main content ---- */
main.content{flex:1; padding:34px 44px 70px; max-width:920px;}
.eyebrow{
  font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold-dark);
  font-weight:700; margin:0 0 6px;
}
h1.page-title{
  font-family:'Fraunces',serif; font-weight:700; color:var(--navy);
  font-size:32px; margin:0 0 12px; line-height:1.1;
}
.objectif-box{
  background:var(--paper); border:1px solid var(--line); border-left:5px solid var(--accent, var(--navy));
  border-radius:8px; padding:16px 18px; margin-bottom:26px;
}
.objectif-box .fr{font-size:15px; line-height:1.55;}
.objectif-box .pt{font-size:13.5px; line-height:1.5; color:var(--pt); font-style:italic; margin-top:6px;}
.label-fr{font-weight:700; color:var(--navy);}
.label-pt{font-weight:700;}

/* ---- login screen ---- */
.login-wrap{display:flex; align-items:center; justify-content:center; min-height:70vh;}
.login-card{
  background:var(--paper); border:1px solid var(--line); border-radius:14px;
  padding:36px 36px 30px; max-width:420px; width:100%; box-shadow:0 4px 22px rgba(20,20,20,.06);
}
.login-card h1{font-family:'Fraunces',serif; color:var(--navy); font-size:26px; margin:0 0 4px;}
.login-card p.sub{color:var(--grey); font-size:14px; margin:0 0 22px;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:12.5px; font-weight:700; color:var(--navy); margin-bottom:5px;}
.field input{
  width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:8px; font-size:15px;
  font-family:'Inter',sans-serif;
}
.level-pill{
  display:inline-flex; align-items:center; gap:6px; background:var(--gold-light); color:var(--navy-deep);
  font-weight:700; font-size:13px; padding:6px 12px; border-radius:20px; margin-bottom:18px;
}
.primary-btn{
  width:100%; padding:12px; border:none; border-radius:8px; background:var(--brand-blue); color:#fff;
  font-weight:700; font-size:15px; cursor:pointer; margin-top:6px;
}
.primary-btn:hover{filter:brightness(0.92);}
.login-err{color:var(--bad); font-size:13px; margin-top:8px; display:none;}
.auth-tabs{display:flex; gap:6px; margin-bottom:20px; background:var(--cream); border-radius:9px; padding:4px;}
.auth-tab{
  flex:1; padding:9px 10px; border:none; border-radius:7px; background:transparent; cursor:pointer;
  font-weight:700; font-size:13px; color:var(--grey); font-family:'Inter',sans-serif;
}
.auth-tab.active{background:var(--brand-blue); color:#fff;}

/* teacher tabs */
.teacher-tabs{display:flex; gap:8px; margin-bottom:20px;}
.tab-btn{
  padding:9px 16px; border:1px solid var(--line); border-radius:8px; background:#fff;
  font-weight:700; font-size:13.5px; cursor:pointer; color:var(--navy);
}
.tab-btn.active{background:var(--brand-blue); color:#fff; border-color:var(--brand-blue);}

/* ---- dossiers grid ---- */
.dossier-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:8px;}
.dossier-card{
  background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:18px 16px;
  text-align:left; cursor:pointer; position:relative; min-height:120px;
  display:flex; flex-direction:column; justify-content:space-between;
}
.dossier-card .num{font-family:'Fraunces',serif; font-weight:700; font-size:26px; color:var(--brand-blue);}
.dossier-card .name{font-size:13.5px; font-weight:600; margin-top:4px;}
.dossier-card .status{font-size:11.5px; margin-top:10px; font-weight:700;}
.dossier-card.open{border-color:var(--ok); border-width:2px;}
.dossier-card.open .status{color:var(--ok);}
.dossier-card.open:hover{box-shadow:0 3px 14px rgba(20,20,20,.08); transform:translateY(-1px);}
.dossier-card.locked{opacity:.55; cursor:default; background:#f4f2ec;}
.dossier-card.locked .status{color:var(--grey);}

/* day cards (as before) */
.day-grid{display:flex; flex-direction:column; gap:18px;}
.day-card{
  background:var(--paper); border:1px solid var(--line); border-radius:12px;
  padding:20px 22px; box-shadow:0 1px 2px rgba(20,20,20,.03);
}
.day-top{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:4px;}
.day-num{
  font-family:'Fraunces',serif; font-weight:700; color:#fff; background:var(--accent, var(--navy));
  border-radius:6px; padding:3px 10px; font-size:13px;
}
.day-dur{font-size:12px; color:var(--grey); font-weight:600;}
h3.day-title{
  font-family:'Fraunces',serif; font-size:19px; font-weight:600; color:var(--ink);
  margin:6px 0 2px;
}
p.day-title-pt{font-size:13.5px; color:var(--pt); font-style:italic; margin:0 0 14px;}

.media-block{margin:10px 0 16px;}
.media-block audio{width:100%; height:36px;}
.media-block iframe{width:100%; height:210px; border:0; border-radius:8px;}
.source-link{
  display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--brand-blue);
  text-decoration:none; font-weight:600; margin-top:6px;
}
.source-link:hover{text-decoration:underline;}
.section-label{
  font-size:11px; text-transform:uppercase; letter-spacing:.1em; font-weight:700;
  color:var(--grey); margin:14px 0 6px;
}

/* exercise */
.exo-box{background:var(--cream); border:1.5px dashed var(--accent, var(--gold)); border-radius:8px; padding:12px 14px; margin-top:6px;}
.exo-consigne{font-size:13.5px; margin:0 0 2px;}
.exo-consigne-pt{font-size:12px; color:var(--pt); font-style:italic; margin:0 0 10px;}
.exo-question{font-weight:600; font-size:14.5px; margin-bottom:10px;}
.exo-options{display:flex; flex-direction:column; gap:7px;}
.exo-opt{
  text-align:left; padding:8px 12px; border-radius:7px; border:1px solid var(--line);
  background:#fff; cursor:pointer; font-size:14px; font-family:'Inter',sans-serif;
  transition:all .12s ease;
}
.exo-opt:hover:not(:disabled){border-color:var(--accent, var(--navy));}
.exo-opt.correct{background:var(--ok-bg); border-color:var(--ok); color:var(--ok); font-weight:700;}
.exo-opt.wrong{background:var(--bad-bg); border-color:var(--bad); color:var(--bad); font-weight:700;}
.exo-opt:disabled{cursor:default;}
.exo-feedback{font-size:13px; margin-top:8px; font-weight:600;}
.exo-feedback.ok{color:var(--ok);}
.exo-feedback.bad{color:var(--bad);}
.exo-text-row{display:flex; gap:8px; margin-top:4px;}
.exo-text-row input{
  flex:1; padding:8px 10px; border-radius:7px; border:1px solid var(--line); font-size:14px;
  font-family:'Inter',sans-serif;
}
.exo-text-row button{
  padding:8px 14px; border-radius:7px; border:none; background:var(--accent, var(--brand-blue)); color:#fff;
  font-weight:600; cursor:pointer; font-size:13.5px;
}
.exo-text-row button:hover{filter:brightness(0.9);}

/* recorder */
.rec-box{
  margin-top:14px; background:#fff; border:1px solid var(--line); border-radius:8px; padding:12px 14px;
  border-left:5px solid var(--accent, var(--gold));
}
.rec-consigne{font-size:13.5px; margin:0 0 2px;}
.rec-consigne-pt{font-size:12px; color:var(--pt); font-style:italic; margin:0 0 10px;}
.rec-controls{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.rec-btn{
  display:inline-flex; align-items:center; gap:7px;
  border:none; border-radius:20px; padding:8px 16px; font-weight:700; font-size:13.5px;
  cursor:pointer; background:var(--accent, var(--brand-blue)); color:#fff;
}
.rec-btn.recording{background:var(--bad); animation:pulse 1.2s infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(239,71,111,.4);}70%{box-shadow:0 0 0 8px rgba(239,71,111,0);}100%{box-shadow:0 0 0 0 rgba(239,71,111,0);}}
.rec-time{font-size:13px; color:var(--grey); font-variant-numeric:tabular-nums;}
.rec-audio{margin-top:10px; width:100%;}
.rec-dl{
  display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--brand-blue);
  font-weight:700; text-decoration:none; margin-top:8px;
}
.rec-dl:hover{text-decoration:underline;}
.rec-status{font-size:12px; color:var(--grey); margin-top:6px;}
.rec-status.ok{color:var(--ok); font-weight:600;}
.rec-status.bad{color:var(--bad); font-weight:600;}

/* oral session box */
.oral-box{margin-top:28px; background:var(--accent, var(--navy)); color:#fff; border-radius:12px; padding:22px 24px;}
.oral-box h4{
  font-family:'Fraunces',serif; font-size:18px; margin:0 0 4px; color:#fff;
  display:flex; align-items:center; gap:8px;
}
.oral-box .pt-title{font-size:12.5px; color:rgba(255,255,255,.75); font-style:italic; margin:0 0 14px;}
.oral-list{margin:0; padding-left:20px;}
.oral-list li{margin-bottom:10px; font-size:14px; line-height:1.5;}
.oral-list li .pt{display:block; font-size:12.5px; color:#c9d3e6; font-style:italic; margin-top:2px;}

.week-footer{display:flex; justify-content:space-between; margin-top:30px;}
.week-footer button{
  background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:10px 18px;
  font-weight:600; color:var(--navy); cursor:pointer; font-size:13.5px;
}
.week-footer button:hover{border-color:var(--navy);}
.week-footer button:disabled{opacity:.3; cursor:default;}

/* bilan */
.bilan-table{width:100%; border-collapse:collapse; margin-top:8px;}
.bilan-table th,.bilan-table td{border:1px solid var(--line); padding:10px 12px; font-size:14px; text-align:left;}
.bilan-table th{background:var(--accent, var(--navy)); color:#fff; font-weight:600;}
.bilan-table tr:nth-child(even) td{background:#f4f1ea;}
.bilan-table td.check{text-align:center; width:70px;}
.bilan-table input[type=checkbox]{width:18px; height:18px;}

/* teacher panel */
.teacher-toolbar{display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap; align-items:center;}
.teacher-toolbar input{flex:1; min-width:200px; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-size:14px;}
.teacher-toolbar button{padding:10px 14px; border:1px solid var(--line); border-radius:8px; background:#fff; font-weight:600; cursor:pointer; font-size:13px;}
.teacher-entry{background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:12px;}
.teacher-entry .who{font-weight:700; color:var(--navy); font-size:14.5px;}
.teacher-entry .meta{font-size:12.5px; color:var(--grey); margin:2px 0 8px;}
.teacher-entry audio{width:100%; height:34px; margin-top:4px;}
.teacher-entry-actions{display:flex; gap:14px; margin-top:8px; align-items:center;}
.teacher-entry-actions a, .teacher-entry-actions button{
  font-size:12.5px; font-weight:700; color:var(--brand-blue); background:none; border:none; cursor:pointer;
  text-decoration:none;
}
.teacher-entry-actions button.del{color:var(--bad);}
.teacher-entry-actions select{
  padding:7px 10px; border-radius:7px; border:1px solid var(--line); font-size:13px; font-family:'Inter',sans-serif;
}
.teacher-entry-actions button:not(.del){
  background:var(--brand-blue); color:#fff; padding:7px 14px; border-radius:7px;
}
.teacher-empty{color:var(--grey); font-size:14px; padding:20px 0;}
.storage-note{
  background:var(--gold-light); color:var(--navy-deep); border-radius:8px; padding:12px 14px;
  font-size:13px; margin-bottom:20px; line-height:1.5;
}

@media (max-width:820px){
  .app{flex-direction:column;}
  .sidebar{width:100%; padding:20px 14px;}
  nav.weeks{flex-direction:row; overflow-x:auto; gap:8px; padding-bottom:4px;}
  .nav-btn{white-space:nowrap;}
  main.content{padding:24px 18px 50px;}
  .sidebar-foot{display:none;}
  .dossier-grid{grid-template-columns:repeat(2,1fr);}
}
</style>
</head>

/* ======================= UTILITAIRES ======================= */
function slug(s){
  return (s||"").toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-+|-+$)/g,'') || "eleve";
}
function norm(s){
  return s.toLowerCase().trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’']/g,"'");
}
function fmtDate(ts){
  try{
    const d = ts && ts.toDate ? ts.toDate() : new Date(ts);
    return d.toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
  }catch(e){ return ''; }
}
function isValidEmail(e){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e); }
function blobToBase64(blob){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onloadend = ()=> resolve(r.result.split(',')[1]);
    r.onerror = reject;
    r.readAsDataURL(blob);
  });
}
/* Appel au Google Apps Script (upload/suppression dans le Drive de la prof).
   Content-Type text/plain volontaire : ça évite le préflight CORS qui bloquerait
   sinon les requêtes vers un Web App Apps Script depuis un autre nom de domaine. */
async function callDriveScript(payload){
  const res = await fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: {'Content-Type': 'text/plain;charset=utf-8'},
    body: JSON.stringify(payload)
  });
  if(!res.ok) throw new Error('Réponse HTTP ' + res.status);
  return await res.json();
}

function afterAuth(uid, record){
  student = {
    prenom:record.prenom, nom:record.nom, email:record.email, telephone:record.telephone, uid,
    uniteCourante: record.uniteCourante || null, frequence: record.frequence || null
  };
  if(record.niveau){ niveau = record.niveau; screen = 'dossiers'; }
  else { niveau = null; screen = 'waiting'; }
  render();

async function saveProgress(tag){
  student.uniteCourante = tag;
  if(!student.uid) return;
  try{ await db.collection('eleves').doc(student.uid).update({uniteCourante: tag}); }
  catch(e){ /* non bloquant */ }
}

      <div class="field"><label>Mot de passe</label><input id="si-pw" type="password" placeholder="••••••••"></div>

    `;
  }
}
function showAuthErr(msg){
  const err = document.getElementById('auth-err');
  if(err){ err.textContent = msg; err.style.display = 'block'; }
}
function friendlyAuthError(code){
  const map = {
    'auth/email-already-in-use': "Un compte existe déjà avec cet e-mail. Connecte-toi plutôt.",
    'auth/invalid-email': "Cet e-mail ne semble pas valide.",
    'auth/weak-password': "Le mot de passe doit contenir au moins 6 caractères.",
    'auth/user-not-found': "Aucun compte avec cet e-mail. Crée un compte.",
    'auth/wrong-password': "Mot de passe incorrect.",
    'auth/invalid-credential': "E-mail ou mot de passe incorrect.",
    'auth/too-many-requests': "Trop de tentatives. Réessaie dans quelques minutes."
  };
  return map[code] || "Une erreur est survenue. Réessaie.";
}
async function doSignup(){
  const prenom = document.getElementById('su-prenom').value.trim();
  const nom = document.getElementById('su-nom').value.trim();
  const email = document.getElementById('su-email').value.trim();
  const telephone = document.getElementById('su-tel').value.trim();
  const pw = document.getElementById('su-pw').value;
  const pw2 = document.getElementById('su-pw2').value;
  if(!prenom || !nom || !email || !telephone || !pw || !pw2){ showAuthErr('Merci de remplir tous les champs.'); return; }
  if(!isValidEmail(email)){ showAuthErr("Cet e-mail ne semble pas valide."); return; }
  if(pw.length < 8){ showAuthErr('Le mot de passe doit contenir au moins 8 caractères.'); return; }
  if(pw !== pw2){ showAuthErr('Les deux mots de passe ne correspondent pas.'); return; }
  const btn = document.getElementById('su-btn'); if(btn){ btn.disabled = true; btn.textContent = 'Création…'; }
  try{
    const cred = await auth.createUserWithEmailAndPassword(email, pw);
    const record = {
      prenom, nom, email, telephone, niveau: null, frequence: null, uniteCourante: null,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    };
    await db.collection('eleves').doc(cred.user.uid).set(record);
    afterAuth(cred.user.uid, record);
  }catch(e){
    showAuthErr(friendlyAuthError(e.code));
    if(btn){ btn.disabled = false; btn.textContent = 'Créer mon compte →'; }
  }
}
async function doSignin(){
  const email = document.getElementById('si-email').value.trim();
  const pw = document.getElementById('si-pw').value;
  if(!email || !pw){ showAuthErr('Merci de renseigner ton e-mail et ton mot de passe.'); return; }
  const btn = document.getElementById('si-btn'); if(btn){ btn.disabled = true; btn.textContent = 'Connexion…'; }
  try{
    const cred = await auth.signInWithEmailAndPassword(email, pw);
    const doc = await db.collection('eleves').doc(cred.user.uid).get();
    if(!doc.exists){ showAuthErr("Ce compte n'a pas de profil élève associé."); return; }
    afterAuth(cred.user.uid, doc.data());
  }catch(e){
    showAuthErr(friendlyAuthError(e.code));
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = 'Se connecter →'; }
  }
}

function mediaHTML(day){
  let html = '';
  if(day.media){
    day.media.forEach(m=>{
      if(m.type==='audio'){
        html += `<div class="media-block"><p class="section-label">🎧 Écouter — Ouvir</p><audio controls src="${m.url}"></audio></div>`;
      } else if(m.type==='video'){
        html += `<div class="media-block"><p class="section-label">▶ Regarder — Assistir</p><iframe src="https://www.youtube.com/embed/${m.id}" loading="lazy" allowfullscreen></iframe></div>`;
      }
    });
  }
  if(day.link){
    html += `<a class="source-link" href="${day.link.url}" target="_blank" rel="noopener">🔗 ${day.link.label}</a>`;
  }
  return html;
}
function exoHTML(day, uid){
  if(!day.exo) return '';

    return `<div class="exo-box">

      <p class="exo-consigne-pt">🇧🇷 Complete a frase.</p>

function renderTeacherList(){
  const list = document.getElementById('teacher-list');
  if(!list) return;
  const filterEl = document.getElementById('teacher-filter');
  const filter = filterEl ? norm(filterEl.value) : '';
  const filtered = teacherData.filter(it=>{

    const hay = norm(`${it.prenom} ${it.nom} ${it.email||''} ${it.semaine} ${it.jour} ${it.activite}`);
    return hay.includes(filter);
  });
  if(filtered.length===0){
    list.innerHTML = '<p class="teacher-empty">Aucun enregistrement pour le moment.</p>';
    return;
  }
  list.innerHTML = filtered.map(it=>{

  }).join('');

async function deleteRecording(id, driveFileId){
  if(!confirm('Supprimer définitivement cet enregistrement (et le fichier dans le Drive) ?')) return;
  try{
    if(driveFileId){ await callDriveScript({action:'delete', fileId: driveFileId}); }
  }catch(e){ /* le document Firestore est quand même supprimé ci-dessous */ }
  try{ await db.collection('enregistrements').doc(id).delete(); }catch(e){ /* ignore */ }
  await loadTeacherRecordings();
}

function answerQCM(uid, chosen, correct){
  const container = document.getElementById('opts-'+uid);
  const buttons = container.querySelectorAll('.exo-opt');
  buttons.forEach((b,i)=>{
    b.disabled = true;
    if(i===correct) b.classList.add('correct');
    if(i===chosen && chosen!==correct) b.classList.add('wrong');
  });
  const fb = document.getElementById('fb-'+uid);
  if(chosen===correct){ fb.textContent = '✔ Correct ! / Correto!'; fb.className = 'exo-feedback ok'; }
  else{ fb.textContent = '✘ La bonne réponse est en vert. / A resposta certa está em verde.'; fb.className = 'exo-feedback bad'; }
}
function checkTexte(uid, accepted){
  const input = document.getElementById('in-'+uid);
  const fb = document.getElementById('fb-'+uid);
  const val = norm(input.value);
  const ok = accepted.some(a=>norm(a)===val);
  if(ok){ fb.textContent = '✔ Correct ! / Correto!'; fb.className = 'exo-feedback ok'; }
  else{ fb.textContent = `✘ Réponse attendue : « ${accepted[0]} ».`; fb.className = 'exo-feedback bad'; }
}

/* ======================= ENREGISTREMENT AUDIO ======================= */
const recorders = {};

function findDayByUid(uid){
  const m = uid.match(/^w(\d+)d(\d+)$/);
  if(!m) return null;
  const w = weeks.find(x=>x.id===parseInt(m[1]));
  if(!w) return null;
  const day = w.days[parseInt(m[2])-1];
  return {week:w, day};
}

async function toggleRec(uid){
  const btn = document.getElementById('btn-'+uid);
  const status = document.getElementById('status-'+uid);
  if(!recorders[uid] || !recorders[uid].active){
    try{
      const stream = await navigator.mediaDevices.getUserMedia({audio:true});
      const mr = new MediaRecorder(stream);
      const chunks = [];
      mr.ondataavailable = e=>chunks.push(e.data);
      mr.onstop = async ()=>{
        const blob = new Blob(chunks, {type: mr.mimeType || 'audio/webm'});
        const url = URL.createObjectURL(blob);
        const player = document.getElementById('player-'+uid);
        player.innerHTML = `<audio class="rec-audio" controls src="${url}"></audio><br>
          <a class="rec-dl" href="${url}" download="${uid}-secours.webm">⬇ Copie locale (secours) / Cópia local</a>`;
        stream.getTracks().forEach(t=>t.stop());
        clearInterval(recorders[uid].timer);
        status.textContent = 'Envoi en cours…';
        status.className = 'rec-status';
        try{
          const ctx = findDayByUid(uid);
          const ext = (blob.type||'').includes('mp4') ? 'm4a' : 'webm';
          const fileName = `${niveau}_${slug(student.prenom)}-${slug(student.nom)}_${ctx.week.tag}-${slug(ctx.day.num)}_${Date.now()}.${ext}`;
          const b64 = await blobToBase64(blob);
          const result = await callDriveScript({
            action: 'upload',
            fileName,
            mimeType: blob.type || 'audio/webm',
            base64: b64
          });
          if(!result || !result.ok) throw new Error(result && result.error || 'échec Drive');
          await db.collection('enregistrements').add({
            uid: student.uid,
            prenom: student.prenom, nom: student.nom, email: student.email, telephone: student.telephone,
            niveau: niveau, dossier: "Dossier 0",
            semaine: ctx.week.tag, jour: ctx.day.num, activite: ctx.day.title_fr,
            driveUrl: result.viewUrl, driveFileId: result.fileId,
            ts: firebase.firestore.FieldValue.serverTimestamp()
          });
          status.textContent = '✅ Enregistrement envoyé à ta professeure.'; status.className = 'rec-status ok';
        }catch(e){
          status.textContent = "⚠ Échec de l'envoi — utilise la copie locale ci-dessus.";
          status.className = 'rec-status bad';
        }
      };
      mr.start();
      let seconds = 0;
      const timeEl = document.getElementById('time-'+uid);
      const timer = setInterval(()=>{
        seconds++;
        const m = String(Math.floor(seconds/60)).padStart(2,'0');
        const s = String(seconds%60).padStart(2,'0');
        timeEl.textContent = `${m}:${s}`;
      }, 1000);
      recorders[uid] = {mr, active:true, timer};
      btn.textContent = '■ Arrêter';
      btn.classList.add('recording');
      status.textContent = 'Enregistrement en cours…';
      status.className = 'rec-status';
    }catch(err){
      status.textContent = "Micro non disponible : autorise l'accès au micro dans ton navigateur.";
      status.className = 'rec-status bad';
    }
  } else {
    recorders[uid].mr.stop();
    recorders[uid].active = false;
    btn.textContent = '● Enregistrer';
    btn.classList.remove('recording');
  }
}

render();
</script>
</body>
</html>
