<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cours expérimental — Administration</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>:root{--navy:#182a6b;--blue:#3a6df0;--gold:#ffb703;--cream:#fff8ef;--line:#ece1cf;--grey:#6b7280}*{box-sizing:border-box}body{margin:0;background:var(--cream);font-family:Inter,sans-serif;color:#20232b}.wrap{max-width:760px;margin:42px auto;padding:0 18px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px;box-shadow:0 4px 22px #0000000f}h1{font-family:Fraunces,serif;color:var(--navy);margin:0 0 8px}.sub{color:var(--grey);margin:0 0 24px}.grid{display:grid;grid-template-columns:2fr 1fr;gap:12px}.field{margin-bottom:14px}label{display:block;font-size:13px;font-weight:700;color:var(--navy);margin-bottom:6px}input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;font:inherit}button{border:0;border-radius:8px;padding:12px 16px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer}.secondary{background:var(--navy)}#login,#creator,#result{display:none}.result{margin-top:22px;padding:18px;background:#f3f6ff;border-radius:10px}.link{word-break:break-all;font-size:13px;margin:10px 0}.err{color:#c92b4b;font-size:13px;margin-top:10px}.ok{color:#067a5d;font-size:13px;margin-top:10px}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="card"><h1>Cours expérimental</h1><p class="sub">Espace professeure — crée un créneau et récupère le lien à envoyer à l’élève.</p><div id="login"><div class="field"><label>E-mail professeure</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>Mot de passe</label><input id="password" type="password" autocomplete="current-password"></div><button onclick="login()">Se connecter</button><div id="loginErr" class="err"></div></div><div id="creator"><div class="grid"><div class="field"><label>Date et heure</label><input id="date" type="datetime-local"></div><div class="field"><label>Durée</label><select id="duration"><option value="30">30 min</option><option value="45" selected>45 min</option><option value="60">60 min</option></select></div></div><button onclick="createTrial()">Créer le cours expérimental</button><div id="createErr" class="err"></div></div><div id="result" class="result"><strong>Lien élève créé</strong><div id="studentLink" class="link"></div><button class="secondary" onclick="copyLink()">Copier le lien</button><div id="copyOk" class="ok"></div></div></section></main><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script>const firebaseConfig={apiKey:'AIzaSyAVT-VM8QyTfOg16P_9juX3dbJsR3e3z3c',authDomain:'fle-profmelissaradde.firebaseapp.com',projectId:'fle-profmelissaradde',storageBucket:'fle-profmelissaradde.firebasestorage.app',messagingSenderId:'670442169351',appId:'1:670442169351:web:535dca29a998c80dc636a2'};const TEACHER_UID='pTbdNp5EiJe2jq80bgCi4Q01i4O2';firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.firestore();let currentLink='';auth.onAuthStateChanged(u=>{const teacher=u&&u.uid===TEACHER_UID;document.getElementById('login').style.display=teacher?'none':'block';document.getElementById('creator').style.display=teacher?'block':'none';if(u&&!teacher){auth.signOut();document.getElementById('loginErr').textContent='Ce compte n’est pas le compte professeure.'}});async function login(){loginErr.textContent='';try{await auth.signInWithEmailAndPassword(email.value.trim(),password.value)}catch(e){loginErr.textContent='Connexion impossible.'}}function token(){const a=new Uint8Array(18);crypto.getRandomValues(a);return Array.from(a,x=>x.toString(16).padStart(2,'0')).join('')}async function createTrial(){createErr.textContent='';result.style.display='none';if(!date.value){createErr.textContent='Choisis une date et une heure.';return}const iso=new Date(date.value).toISOString(),t=token();try{const ref=await db.collection('disponibilites').add({date:iso,duree:Number(duration.value),isExperimental:true,experimentalToken:t,reservedBy:null,reservedName:null,reservedEmail:null,reminderSent:false,confirmed:false,createdAt:firebase.firestore.FieldValue.serverTimestamp()});currentLink=new URL('cours-experimental.html',location.href).href+'?token='+encodeURIComponent(t)+'&slot='+encodeURIComponent(ref.id);studentLink.textContent=currentLink;result.style.display='block'}catch(e){createErr.textContent='Impossible de créer le créneau dans Firestore.'}}async function copyLink(){try{await navigator.clipboard.writeText(currentLink);copyOk.textContent='Lien copié.'}catch(e){copyOk.textContent='Copie le lien affiché ci-dessus.'}}</script></body></html>
